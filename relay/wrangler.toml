name = "circuitpilot-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Websites allowed to use this relay (comma separated). Add your own GitHub Pages address if you fork the project.
ALLOWED_ORIGINS = "https://pcbgo.site,https://www.pcbgo.site,https://bodynet.net,https://www.bodynet.net,https://abdelhayali.github.io,http://localhost:5173,http://127.0.0.1:5173"

# GitHub sign-in (optional). The client ID is public; the client secret is NOT stored here:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
# and set GITHUB_CLIENT_ID below to the OAuth app's Client ID.
GITHUB_CLIENT_ID = "Ov23li0Owt2MkdkwsTOy"

# Shared AI pool (relay/pool.js): one key-value namespace for the provider accounts, usage counters and limits.
#   npx wrangler kv namespace create POOL      (then paste the id it prints below)
[[kv_namespaces]]
binding = "POOL"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# The GitHub login that may open /admin (the admin page). Set it as a secret, not in this file:
#   npx wrangler secret put ADMIN_LOGIN
